<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parquímetro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Parquímetro</h1>
    </header>
    <main>
        <section class="orientacoes">
            <h2>Orientações de uso:</h2>
            <p>Permanencia máxima 3 horas.</p>
            <p>R$2,00 por hora.</p>
            <p>Recarga mínima R$1,00.</p>
        </section>
        <section class="dados">
            <h2>Estacionar</h2>
            <div>
                <label for="deposito">Inserir valor</label>
                <input type="number" min="1" id="deposito" placeholder="R$0,00" required>
            </div>
            <div>
                <label for="valor-horas">Selecione o tempo</label>
                <select class="valor-horas" id="valor-horas" required>
                </select>
            </div>
            <div>
                <button id="btn-calcular">Calcular</button>
            </div>
        </section>
        <section class="resultados">
            <p id="res-valor"></p>
            <p id="res-horas"></p>
            <p id="res-troco"></p>
            <p id="res-mensagem"></p>
        </section>
    </main>
    <script type="module" src="js/app.js"></script>
</body>
</html>
